version: '3.8'

services:
  web:
    build: .
    container_name: osetracker-web
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=mysql://osetracker:osepassword@db/osetracker
      - SECRET_KEY=dev-key-please-change-in-production
      - FLASK_APP=wsgi.py
      - FLASK_DEBUG=1
      - ALLOW_REGISTRATIONS=True

  db:
    image: mysql:8.0
    container_name: osetracker-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=osetracker
      - MYSQL_USER=osetracker
      - MYSQL_PASSWORD=osepassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: